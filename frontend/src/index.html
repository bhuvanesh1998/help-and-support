<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HelpAssistant User Manual · Step-by-step guides &amp; support</title>
    <meta name="description" content="Step-by-step user manuals for every screen, searchable by keyword, with 24x7 support ticketing." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HelpAssistant" />
    <meta property="og:title" content="HelpAssistant User Manual" />
    <meta property="og:description" content="Step-by-step user manuals for every screen, searchable by keyword, with 24x7 support ticketing." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="HelpAssistant User Manual" />
    <meta name="twitter:description" content="Step-by-step user manuals for every screen, searchable by keyword, with 24x7 support ticketing." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "HelpAssistant User Manual",
        "url": "https://doc.medicore.cc/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": { "@type": "EntryPoint", "urlTemplate": "https://doc.medicore.cc/search?q={search_term_string}" },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Inter and Material Icons are bundled from node_modules (see styles.scss),
         so neither the build nor the browser needs to reach fonts.googleapis.com. -->
  </head>
  <body>
    <ha-root></ha-root>
  </body>
</html>
